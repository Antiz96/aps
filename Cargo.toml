[package]
name = "aps"
version = "1.2.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
flate2 = "1.1.9"
gix = { version = "0.86.0", features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "max-performance",
  "parallel",
] }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
