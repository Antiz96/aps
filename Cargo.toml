[package]
name = "aps"
version = "1.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
flate2 = "1.1.9"
gix = { version = "0.86.0", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls" ] }
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
